[package]
name = "hack-juno-registry-adapter"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-schema = "=2.2.2"
cosmwasm-std = "=2.2.2"
cw-storage-plus = "=2.0.0"
cw2 = "=2.0.0"
thiserror = "=1.0.69"

[dev-dependencies]
cw-multi-test = "=2.2.0"
proptest = "=1.6.0"
juno-voice-bounties = { path = "../juno-voice-bounties", features = ["library"] }
