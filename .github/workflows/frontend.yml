name: Frontend production gates

on:
  workflow_dispatch:
  pull_request:
    paths: ["app/**", "README.md", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["app/**", "README.md", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: Frozen install and production gates
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frozen dependency install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, component, accessibility, and policy tests
        run: npm test
      - name: Production dependency audit
        run: npm run audit:production
      - name: Build deployable Pages artifact
        env:
          VITE_BASE_PATH: /juno-voice/
          VITE_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Bundle-size and signing-symbol regression gates
        run: npm run check:production
      - name: Verify frozen gates leave tracked inputs unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (provenance, states, retry, refresh)
        run: npm run test:e2e

  pages-artifact:
    name: Package reviewed main artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Reproduce reviewed artifact
        working-directory: app
        env:
          VITE_BASE_PATH: /juno-voice/
          VITE_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          npm ci
          npm run build
          npm run check:production
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: app/dist

  deploy:
    name: Deploy reviewed main to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-artifact
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
