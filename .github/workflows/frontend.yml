name: Frontend CI

on:
  pull_request:
    paths: ['app/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
